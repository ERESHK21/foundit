services:
  - type: web
    name: foundit-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://foundit-lilac.vercel.app
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70
