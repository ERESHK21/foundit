spring.application.name=foundit-backend
server.port=${PORT:8080}

# H2 file database - zero setup. Swap for Postgres by overriding spring.datasource.*
spring.datasource.url=jdbc:h2:file:./data/foundit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=foundit-super-secret-key-change-me-in-production-0123456789
app.jwt.ttl-hours=24
app.upload-dir=uploads
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
